name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y                 autoconf automake autopoint ccache cmake g++ gcc git lbzip2                 libffi-dev libltdl-dev libtool libssl-dev make ninja-build                 patch pkg-config python3-dev python3-venv unzip wget zip                 openjdk-17-jdk zlib1g-dev

      - name: Install Python build dependencies
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Install Android NDK r28c
        run: sdkmanager "ndk;28.2.13676358"

      - name: Build patched Android Dropbear
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: python tools/build_dropbear.py

      - name: Run checks
        run: pytest -q

      - name: Configure Buildozer to reuse the installed NDK
        run: echo "android.ndk_path = $ANDROID_HOME/ndk/28.2.13676358" >> buildozer.spec

      - name: Build APK
        run: buildozer android debug

      - uses: actions/upload-artifact@v4
        with:
          name: sms-gateway-oss-debug-apk
          path: bin/*.apk
